<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a14">
  <title>בוט השירים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #8b5cf6;
      --accent2: #ec4899;
      --text: #f4f4f8;
      --muted: rgba(244,244,248,.62);
      --glass: rgba(18,16,32,.55);
      --glass-strong: rgba(18,16,32,.78);
      --stroke: rgba(255,255,255,.12);
      --overlay: .35;
      --blur: 0px;
      --radius: 22px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: 'Rubik', system-ui, sans-serif; color: var(--text);
      background: #0b0a14; overflow: hidden;
    }

    /* ===== רקע ===== */
    #bg, #bgShade { position: fixed; inset: -40px; z-index: 0; }
    #bg {
      background: linear-gradient(135deg, #1e1b4b, #581c87 50%, #831843);
      background-size: cover; background-position: center;
      filter: blur(var(--blur)); transition: background .6s ease;
    }
    #bg.animated { background-size: 300% 300% !important; animation: drift 18s ease infinite; }
    @keyframes drift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    #bgShade { background: rgba(0,0,0,var(--overlay)); pointer-events: none; }

    .app {
      position: relative; z-index: 1; height: 100vh; height: 100dvh;
      max-width: 820px; margin: 0 auto; display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    /* ===== כותרת ===== */
    header {
      margin: 14px 14px 0; padding: 12px 16px; border-radius: var(--radius);
      background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--stroke); display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 50%, transparent);
    }
    header h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.3px;
                background: linear-gradient(90deg, var(--text), color-mix(in srgb, var(--accent) 60%, var(--text)));
                -webkit-background-clip: text; background-clip: text; color: transparent; }
    header small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
    .hbtns { margin-inline-start: auto; display: flex; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06); color: var(--text); font-size: 18px; cursor: pointer;
      display: grid; place-items: center; transition: .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.14); transform: translateY(-1px); }

    /* ===== צ'אט ===== */
    #chat {
      flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 12px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent;
    }
    .msg {
      max-width: 86%; padding: 12px 16px; border-radius: 20px; line-height: 1.5; word-wrap: break-word;
      animation: pop .35s cubic-bezier(.2,.9,.3,1.3);
    }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); } }
    .me {
      align-self: flex-start; color: #fff; border-bottom-right-radius: 6px;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000));
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .me.lec { background: linear-gradient(135deg, var(--accent2), color-mix(in srgb, var(--accent2) 70%, #000)); }
    .me.vid { background: linear-gradient(135deg, #0ea5e9, #0369a1); }
    .result video { width: 100%; margin-top: 10px; border-radius: 14px; background: #000; max-height: 60vh; }
    .bot {
      align-self: flex-end; border-bottom-left-radius: 6px;
      background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--stroke);
    }
    .welcome { text-align: center; align-self: center; max-width: 440px; padding: 22px; }
    .welcome .big { font-size: 40px; margin-bottom: 6px; }
    .welcome b { font-weight: 700; }
    .muted { color: var(--muted); font-size: 13px; }

    /* ===== המתנה: תקליט מסתובב + טיימר ===== */
    .loading { display: flex; align-items: center; gap: 14px; min-width: 250px; }
    .vinyl {
      width: 54px; height: 54px; border-radius: 50%; flex: none; position: relative;
      background: repeating-radial-gradient(circle, #111 0 2px, #1d1d1d 2px 4px);
      box-shadow: 0 0 0 2px rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.5);
      animation: spin 1.6s linear infinite;
    }
    .vinyl::after {
      content: ''; position: absolute; inset: 18px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: inset 0 0 0 5px rgba(0,0,0,.25);
    }
    .vinyl::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 70%, rgba(255,255,255,.18) 80%, transparent 90%);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ltext { flex: 1; }
    .status { font-weight: 500; font-size: 15px; }
    .timer {
      font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 800; letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.2;
    }
    .eq { display: flex; gap: 3px; align-items: flex-end; height: 18px; margin-top: 4px; }
    .eq i { width: 4px; border-radius: 2px; background: var(--accent2); animation: eq 1s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: .15s; background: var(--accent); }
    .eq i:nth-child(3) { animation-delay: .3s; }
    .eq i:nth-child(4) { animation-delay: .45s; background: var(--accent); }
    .eq i:nth-child(5) { animation-delay: .6s; }
    @keyframes eq { 0%,100% { height: 4px; } 50% { height: 18px; } }

    /* ===== תוצאה ===== */
    .result { min-width: 260px; }
    .rtitle { font-weight: 700; font-size: 16px; }
    .done-time { display: inline-block; margin-top: 4px; font-size: 12px; padding: 3px 9px; border-radius: 99px;
                 background: rgba(34,197,94,.18); color: #86efac; }
    .result audio { width: 100%; margin-top: 10px; height: 40px; border-radius: 12px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .actions a, .actions button {
      background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--stroke); border-radius: 12px;
      padding: 8px 12px; font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; transition: .2s;
    }
    .actions a:hover, .actions button:hover { background: rgba(255,255,255,.16); }
    .actions .primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #fff; }
    .err { color: #fda4af; }

    /* ===== תחתית ===== */
    .bottom {
      margin: 0 14px 14px; padding: 12px; border-radius: var(--radius);
      background: var(--glass-strong); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--stroke);
    }
    .modes { display: flex; gap: 6px; margin-bottom: 10px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,.25); }
    .modes button {
      flex: 1; padding: 9px 4px; border-radius: 11px; border: 0; background: transparent; white-space: nowrap;
      color: var(--muted); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; transition: .25s;
    }
    .modes button.on[data-mode="song"]    { background: var(--accent);  color: #fff; }
    .modes button.on[data-mode="lecture"] { background: var(--accent2); color: #fff; }
    .modes button.on[data-mode="video"]   { background: #0ea5e9; color: #fff; }
    .modes button.on[data-mode="album"]   { background: linear-gradient(135deg, #f59e0b, #b45309); color: #fff; }
    .me.alb { background: linear-gradient(135deg, #f59e0b, #b45309); }
    .zipcard { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 12px; border-radius: 14px;
               background: rgba(127,127,127,.1); border: 1px solid var(--stroke); font-size: 14px; }
    .zipcard .zi { font-size: 30px; }
    .modes button.on[data-mode="ai"]      { background: linear-gradient(135deg, #10b981, #0ea5e9); color: #fff; }
    #aichat { display: none; }
    .ai #chat { display: none; }
    .ai #aichat { display: flex; }
    .me.ai { background: linear-gradient(135deg, #10b981, #047857); }
    .md p { margin: 0 0 8px; } .md p:last-child { margin: 0; }
    .md ul, .md ol { margin: 4px 0 8px; padding-inline-start: 20px; }
    .md code { background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 6px; font-size: 13px; }
    .md a { color: #93c5fd; }
    .aiimg { width: 100%; max-width: 420px; border-radius: 14px; margin-top: 10px; display: block; }
    .thumb { max-width: 160px; border-radius: 12px; display: block; margin-top: 6px; }
    .srcs { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .srcs a { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .typing { display: flex; gap: 5px; padding: 6px 2px; }
    .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
    #attach { width: 54px; height: 52px; flex: none; border-radius: 14px; border: 1px solid var(--stroke); background: rgba(255,255,255,.07);
              color: var(--text); font-size: 20px; cursor: pointer; display: none; }
    .ai #attach { display: block; }
    #preview { display: none; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
    #preview img { height: 48px; border-radius: 8px; }
    #preview button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
    .newchat { align-self: center; font: inherit; font-size: 12px; color: var(--muted); background: rgba(0,0,0,.28);
               border: 1px solid var(--stroke); border-radius: 99px; padding: 4px 14px; cursor: pointer; }
    form { display: flex; gap: 8px; align-items: flex-end; }
    #q {
      flex: 1; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--stroke); display: block;
      background: rgba(255,255,255,.07); color: var(--text); font: inherit; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s;
      resize: none; line-height: 1.45; height: 52px; min-height: 52px; max-height: 160px; overflow-y: auto;
    }
    #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
    #q::placeholder { color: var(--muted); }
    #send {
      width: 54px; height: 52px; flex: none; border: 0; border-radius: 14px; cursor: pointer; font-size: 20px; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); transition: .2s;
    }
    #send:hover { transform: scale(1.05); }
    #send:active { transform: scale(.95); }

    /* ===== לוח עיצוב ===== */
    .panel-bg { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: .3s; }
    .panel-bg.open { opacity: 1; pointer-events: auto; }
    .panel {
      position: fixed; z-index: 21; top: 0; bottom: 0; left: 0; width: min(380px, 92vw); overflow-y: auto;
      background: rgba(16,14,28,.94); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--stroke); padding: 20px; transform: translateX(-105%);
      transition: transform .35s cubic-bezier(.2,.9,.3,1);
    }
    .panel.open { transform: none; }
    .panel h2 { margin: 0 0 4px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
    .panel h3 { margin: 22px 0 10px; font-size: 14px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
    .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sw {
      aspect-ratio: 1; border-radius: 14px; border: 2px solid transparent; cursor: pointer; transition: .2s;
      background-size: cover; background-position: center;
    }
    .sw:hover { transform: scale(1.06); }
    .sw.on { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .row label { flex: 1; font-size: 14px; }
    .row input[type=color] { width: 44px; height: 34px; border: 0; border-radius: 10px; background: none; cursor: pointer; padding: 0; }
    .row input[type=range] { flex: 1.4; accent-color: var(--accent); }
    .row .val { width: 42px; text-align: left; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pbtn {
      width: 100%; padding: 11px; margin-top: 8px; border-radius: 12px; border: 1px solid var(--stroke);
      background: rgba(255,255,255,.07); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; transition: .2s;
    }
    .pbtn:hover { background: rgba(255,255,255,.14); }
    .pbtn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; color: #fff; font-weight: 500; }
    .urlrow { display: flex; gap: 6px; margin-top: 8px; }
    .urlrow input {
      flex: 1; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--stroke);
      background: rgba(255,255,255,.07); color: var(--text); font: inherit; font-size: 13px; direction: ltr;
    }
    .urlrow button { padding: 0 14px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    .switch { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 14px; }
    .switch input { width: 20px; height: 20px; accent-color: var(--accent); }


    /* ===== היסטוריה ===== */
    #history { display: flex; flex-direction: column; gap: 12px; }
    .divider { align-self: center; font-size: 12px; color: var(--muted); padding: 4px 14px; border-radius: 99px;
               background: rgba(0,0,0,.28); border: 1px solid var(--stroke); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .old { animation: none; }
    .bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 10px; }
    .bar i { display: block; height: 100%; width: 0; border-radius: 99px;
             background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }
    .sync { font-size: 13px; color: var(--muted); }
    .pbtn.danger { border-color: rgba(248,113,113,.35); color: #fca5a5; }

    .ck { width: 100%; height: 90px; margin-top: 6px; padding: 10px; border-radius: 12px; border: 1px solid var(--stroke);
          background: rgba(255,255,255,.07); color: var(--text); font: 12px monospace; direction: ltr; resize: vertical; }
    .ckstat { font-size: 13px; margin: 6px 0 2px; }
    .help { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 6px 0; }
    /* ===== ערכות עיצוב ===== */
    .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .th { border-radius: 14px; border: 2px solid transparent; cursor: pointer; padding: 0; overflow: hidden;
          background: none; color: var(--text); font: inherit; font-size: 12px; transition: .2s; }
    .th:hover { transform: translateY(-2px); }
    .th.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }
    .th .pv { height: 46px; display: flex; align-items: flex-end; gap: 4px; padding: 6px; }
    .th .pv i { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .th .nm { display: block; padding: 5px 2px; background: rgba(127,127,127,.12); }

    /* ===== זמרים מותרים ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font-size: 13px;
            background: color-mix(in srgb, var(--accent) 22%, transparent); border: 1px solid var(--stroke); }
    .chip button { background: none; border: 0; color: inherit; cursor: pointer; font-size: 13px; padding: 0; opacity: .7; }
    .chip button:hover { opacity: 1; }
    .sgbox { margin: 10px 0; border: 1px solid var(--stroke); border-radius: 14px; padding: 4px 12px;
             background: rgba(127,127,127,.06); }
    .sgbox summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
                     padding: 8px 0; font-size: 14px; font-weight: 500; user-select: none; }
    .sgbox summary::-webkit-details-marker { display: none; }
    .sgbox .chev { transition: transform .25s; opacity: .7; }
    .sgbox[open] .chev { transform: rotate(180deg); }
    .sgbox .chips { max-height: 45vh; overflow-y: auto; padding-bottom: 6px; }
    .pin { width: 100%; padding: 10px 12px; margin-top: 6px; border-radius: 12px; border: 1px solid var(--stroke);
           background: rgba(255,255,255,.07); color: var(--text); font: inherit; font-size: 14px; }
    .md h4 { margin: 12px 0 6px; font-size: 16px; }
    .md h4:first-child { margin-top: 0; }

    /* ===== מצב בהיר ===== */
    body.light {
      --text: #1d1933; --muted: rgba(29,25,51,.62);
      --glass: rgba(255,255,255,.66); --glass-strong: rgba(255,255,255,.84); --stroke: rgba(29,25,51,.12);
      background: #f4f4f8;
    }
    body.light #bgShade { background: rgba(255,255,255,var(--overlay)); }
    body.light .icon-btn, body.light .actions a, body.light .actions button, body.light #attach, body.light #q,
    body.light .pbtn, body.light .urlrow input, body.light .ck, body.light .pin { background: rgba(29,25,51,.05); }
    body.light .icon-btn:hover, body.light .pbtn:hover, body.light .actions a:hover, body.light .actions button:hover { background: rgba(29,25,51,.1); }
    body.light .actions .primary, body.light .pbtn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    body.light .modes, body.light .newchat, body.light .divider { background: rgba(29,25,51,.07); }
    body.light .panel { background: rgba(255,255,255,.96); }
    body.light .panel-bg { background: rgba(0,0,0,.25); }
    body.light .bar { background: rgba(29,25,51,.1); }
    body.light .md code { background: rgba(29,25,51,.08); }
    body.light .md a { color: #2563eb; }
    body.light .err { color: #e11d48; }
    body.light .done-time { color: #15803d; background: rgba(34,197,94,.15); }
    body.light .pbtn.danger { color: #dc2626; }
    body.light .sw.on { border-color: #1d1933; }
    body.light #chat { scrollbar-color: rgba(0,0,0,.2) transparent; }
    body.light .bot { box-shadow: 0 4px 16px rgba(29,25,51,.06); }

    /* ===== חלון סיסמה בסגנון טרמינל ===== */
    .pmodal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 16px;
              background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .pmodal.open { display: grid; animation: fade .2s; }
    @keyframes fade { from { opacity: 0; } }
    .pbox { display: block; width: min(380px, 100%); border-radius: 18px; padd
